[build-system]
requires = ["setuptools>=45", "wheel"]

[project]
name = "sistena_onix"
description = "Sistena Onix integration for Home Assistant"
authors = [
    {name = "Vadim Markovtsev", email = "gmarkhor@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "homeassistant>=2025.11.0",
    "acme>=2.1.0",  # Fix deprecation warning in pyOpenSSL
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/vmarkovtsev/sistena_onix"
Repository = "https://github.com/vmarkovtsev/sistena_onix"
Issues = "https://github.com/vmarkovtsev/sistena_onix/issues"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true